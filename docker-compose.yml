version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: darkpattern_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: darkpattern_ai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dp_network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:alpine
    container_name: darkpattern_redis
    ports:
      - "6379:6379"
    networks:
      - dp_network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: darkpattern_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=development
      - DATABASE_URL=mysql+pymysql://root:root@mysql:3306/darkpattern_ai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JWT_SECRET_KEY=dev_jwt_secret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dp_network

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: darkpattern_worker
    command: celery -A app.extensions.celery worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - ./ml:/app/ml
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@mysql:3306/darkpattern_ai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - mysql
    networks:
      - dp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: darkpattern_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
    networks:
      - dp_network

  mlflow:
    image: python:3.11-slim
    container_name: darkpattern_mlflow
    ports:
      - "5001:5000"
    command: >
      bash -c "pip install mlflow[sqlalchemy] pymysql &&
               mlflow server --host 0.0.0.0
               --backend-store-uri mysql+pymysql://root:root@mysql:3306/darkpattern_ai
               --default-artifact-root /mlflow"
    volumes:
      - ./storage/mlflow:/mlflow
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dp_network

volumes:
  mysql_data:

networks:
  dp_network:
    driver: bridge
